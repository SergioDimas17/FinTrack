name: FinTrack CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  BASE_URL: ${{ secrets.BASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.K6_ANON_KEY }}
  K6_ANON_KEY: ${{ secrets.K6_ANON_KEY }}
  K6_TEST_EMAIL: ${{ secrets.K6_TEST_EMAIL }}
  K6_TEST_PASSWORD: ${{ secrets.K6_TEST_PASSWORD }}

jobs:
  test-api:
    name: API Tests (Karate - Isolated)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Single API Test (Login)
        working-directory: fintrack-automation/api-automation
        # Ejecutamos EXCLUSIVAMENTE el feature de login usando karate.options
        run: mvn test -Dkarate.env=qa -Dkarate.options="classpath:features/authentication/login.feature"
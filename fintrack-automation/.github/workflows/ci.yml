name: FinTrack CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  BASE_URL: ${{ secrets.BASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.K6_ANON_KEY }}
  K6_ANON_KEY: ${{ secrets.K6_ANON_KEY }}
  K6_TEST_EMAIL: ${{ secrets.K6_TEST_EMAIL }}
  K6_TEST_PASSWORD: ${{ secrets.K6_TEST_PASSWORD }}

jobs:
  test-api:
    name: API Tests (Karate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run API Tests
        working-directory: fintrack-automation/api-automation
        run: mvn test -Dkarate.env=qa

      # =================================================================
      # NUEVO PASO: Extraer el reporte gráfico de Karate como Artefacto
      # =================================================================
      - name: Upload Karate HTML Report
        uses: actions/upload-artifact@v4
        if: always() # Crucial: Extraer el reporte AUNQUE la prueba falle
        with:
          name: karate-api-report
          path: fintrack-automation/api-automation/target/karate-reports/
          retention-days: 7
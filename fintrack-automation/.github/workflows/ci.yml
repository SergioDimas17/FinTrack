name: FinTrack CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-api:
    name: API Tests (Karate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run API Tests
        working-directory: fintrack-automation/api-automation
        run: mvn test -Dkarate.env=qa

  test-web:
    name: Web Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Playwright Browsers
        working-directory: fintrack-automation/web-automation
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

      - name: Run Web Tests
        working-directory: fintrack-automation/web-automation
        run: mvn test -Denv=qa -Dexec.skip=true

  test-performance:
    name: Performance Tests (k6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Smoke Test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          K6_ANON_KEY: ${{ secrets.K6_ANON_KEY }}
          K6_TEST_EMAIL: ${{ secrets.K6_TEST_EMAIL }}
          K6_TEST_PASSWORD: ${{ secrets.K6_TEST_PASSWORD }}
        run: k6 run fintrack-automation/performance/scripts/smoke.js
name: Performance Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'performance/**'
  workflow_dispatch:

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up k6
        uses: grafana/k6-action@v0.3.0
        with:
          filename: performance/scripts/smoke.js
        env:
          K6_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          K6_TEST_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          K6_TEST_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload k6 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: performance/reports/

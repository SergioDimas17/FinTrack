name: API Smoke Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'api-automation/**'
  pull_request:
    branches: [main]
    paths:
      - 'api-automation/**'
  workflow_dispatch:

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Smoke Tests
        working-directory: api-automation
        env:
          KARATE_ENV: qa
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: mvn clean test -Dtest=SmokeRunner -B

      - name: Upload Karate Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports
          path: api-automation/target/karate-reports/

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml-api
          path: api-automation/target/surefire-reports/

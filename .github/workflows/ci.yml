name: FinTrack CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-web:
    name: 1. Web Tests (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Paso crítico: Instalar navegadores de Playwright con sus dependencias de Linux
      - name: Install Playwright Browsers
        working-directory: fintrack-automation/web-automation
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

      # Ejecución de la suite Smoke de Web
      - name: Run Web Smoke Suite
        working-directory: fintrack-automation/web-automation
        run: >
          mvn test
          -Denv=qa
          -Dexec.skip=true
          -Dtest=SmokeTest
          -DwebUrl=https://fintech-micro-transf-6q7b.bolt.host
          -DTEST_USER_EMAIL=${{ secrets.K6_TEST_EMAIL }}
          -DTEST_USER_PASSWORD=${{ secrets.K6_TEST_PASSWORD }}
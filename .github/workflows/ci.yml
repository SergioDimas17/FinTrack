name: FinTrack CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

# 1. Variables globales para que TODOS los jobs puedan autenticarse en Supabase
env:
  BASE_URL: ${{ secrets.BASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.K6_ANON_KEY }}
  K6_ANON_KEY: ${{ secrets.K6_ANON_KEY }}
  K6_TEST_EMAIL: ${{ secrets.K6_TEST_EMAIL }}
  K6_TEST_PASSWORD: ${{ secrets.K6_TEST_PASSWORD }}

jobs:
  test-api:
    name: API Tests (Karate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run API Tests
        working-directory: fintrack-automation/api-automation
        run: mvn test -Dkarate.env=qa

  test-web:
    name: Web Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Playwright Browsers
        working-directory: fintrack-automation/web-automation
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

      - name: Run Web Tests
        working-directory: fintrack-automation/web-automation
        run: mvn test -Denv=qa -Dexec.skip=true

  test-performance:
    name: Performance Tests (k6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Smoke Test
        run: k6 run fintrack-automation/performance/scripts/smoke.js

  # --------------------------------------------------------------------------------
  # NOTA DE ARQUITECTURA: 
  # El job de Mobile (Appium) requiere un emulador Android (hardware acceleration), 
  # lo cual no está soportado nativamente en runners de Linux gratuitos.
  # En un entorno empresarial, aquí se integraría BrowserStack o Firebase Test Lab.
  # Por ello, se omite temporalmente de la ejecución en la nube.
  # --------------------------------------------------------------------------------
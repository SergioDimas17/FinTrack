name: FinTrack CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # =========================================================================
  # PASO 1: WEB AUTOMATION (PLAYWRIGHT)
  # =========================================================================
  test-web:
    name: 1. Web Tests (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pom.xml') }}

      - name: Install Playwright Browsers (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: fintrack-automation/web-automation
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install chromium --with-deps"

      - name: Run Web Smoke Suite
        working-directory: fintrack-automation/web-automation
        run: >
          mvn test
          -Denv=qa
          -Dexec.skip=true
          -Dheadless=true
          -Dtest=SmokeTest
          -DwebUrl=https://fintech-micro-transf-6q7b.bolt.host
          -DTEST_USER_EMAIL="${{ secrets.K6_TEST_EMAIL || 'pruebasQA@gmail.com' }}"
          -DTEST_USER_PASSWORD="${{ secrets.K6_TEST_PASSWORD || 'pruebas123' }}"

  # =========================================================================
  # PASO 2: API AUTOMATION (KARATE)
  # =========================================================================
  test-api:
    name: 2. API Tests (Karate)
    needs: test-web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run API Tests
        working-directory: fintrack-automation/api-automation
        run: >
          mvn test
          -Dkarate.env=qa
          -DK6_TEST_EMAIL="${{ secrets.K6_TEST_EMAIL }}"
          -DK6_TEST_PASSWORD="${{ secrets.K6_TEST_PASSWORD }}"
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://wlsxfjlaxxwgnbhmtgmw.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.K6_ANON_KEY }}
          K6_TEST_EMAIL: ${{ secrets.K6_TEST_EMAIL }}
          K6_TEST_PASSWORD: ${{ secrets.K6_TEST_PASSWORD }}

      - name: Subir reportes de Karate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports
          path: fintrack-automation/api-automation/target/karate-reports/

  # =========================================================================
  # PASO 3: PERFORMANCE TESTING (K6)
  # =========================================================================
  test-performance:
    name: 3. Performance Tests (k6)
    needs: test-api
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup k6 binary
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Test
        working-directory: fintrack-automation/performance/scripts
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://wlsxfjlaxxwgnbhmtgmw.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.K6_ANON_KEY }}
          K6_TEST_EMAIL: ${{ secrets.K6_TEST_EMAIL }}
          K6_TEST_PASSWORD: ${{ secrets.K6_TEST_PASSWORD }}
        run: |
          k6 run smoke.js

  # =========================================================================
  # PASO 4: Escaneo de Seguridad DAST con OWASP ZAP (Docker directo + Artifacts v4)
  # =========================================================================
  security-scan:
    name: 4. OWASP ZAP DAST Scan
    needs: test-performance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scan
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm \
            -v ${{ github.workspace }}/zap-reports:/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "${{ secrets.BASE_URL || 'https://wlsxfjlaxxwgnbhmtgmw.supabase.co' }}" \
            -r report_html.html \
            -J report_json.json \
            -w report_md.md \
            -I || true

      - name: Subir Reporte de OWASP ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report
          path: zap-reports/